name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Empacotar módulo
        run: zip -r chat-from-top.zip module.json scripts styles lang README.md LICENSE CHANGELOG.md

      - name: Publicar release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            module.json
            chat-from-top.zip
